name: Set up Node, pnpm and dependencies
description: >-
  Node from package.json's engines, pnpm from its packageManager field, and
  the locked dependencies, with the pnpm store cached between runs.

inputs:
  save-cache:
    description: >-
      Save the pnpm store to the cache. Turn it off in a job that runs a PR's
      code in the default branch's scope (repository_dispatch), or the PR
      could fill main's cache.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json

    # Node 26 ships without corepack, so pnpm comes from npm, at the exact
    # version package.json pins.
    - name: Install pnpm
      shell: bash
      run: npm install --global "$(node -p 'require("./package.json").packageManager')"

    - name: Find the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
