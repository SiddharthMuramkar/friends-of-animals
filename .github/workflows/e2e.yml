name: Production smoke

# The read-only production smoke suite (tests/e2e/prod-smoke.spec.ts), run by
# hand against a live deployment: gh workflow run e2e.yml -f url=https://friendsofanimals.dev
# It creates no data, needs no secret, and never runs against a PR: the full
# journeys run in ci.yml against `next start`.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment to check, e.g. https://friendsofanimals.dev
        required: true
      ref:
        description: Branch or commit whose tests to run
        required: true
        default: main

run-name: Production smoke on ${{ inputs.url }} (tests from ${{ inputs.ref }})

concurrency:
  group: prod-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prod-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          save-cache: false

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the smoke suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.url }}
        run: pnpm test:e2e --project=prod-smoke

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
