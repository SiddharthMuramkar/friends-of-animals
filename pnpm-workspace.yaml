# `pnpm add` saves the exact version, so package.json keeps pinning every
# dependency (SPEC §2).
saveExact: true

# pnpm 12 fails the install when a dependency has an install script that is not
# listed here. true = run it, false = skip it.
allowBuilds:
  # Checks and links its platform binary.
  esbuild: true
  # Next.js uses sharp's prebuilt @img/sharp-* binaries; its script only
  # builds from source.
  sharp: false
  # next-intl's message extractor deps. Prebuilt binaries arrive as optional
  # platform packages; the scripts only verify or build from source, and we
  # don't enable the extractor.
  "@swc/core": false
  "@parcel/watcher": false
