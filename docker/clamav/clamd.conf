DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 127.0.0.1
TCPAddr 10.112.14.2

# Load one signature engine at a time within the 2 GiB container limit.
ConcurrentDatabaseReload no

# A file over clamd's scan limits (MaxFileSize, MaxScanSize, MaxRecursion) is
# only partly scanned. Report it as Heuristics.Limits.Exceeded FOUND, so it is
# rejected instead of passing as `stream: OK`.
AlertExceedsMax yes

# Entry videos are up to 200 MB (#86). clamd's defaults (100M a stream and
# a file, 2 minutes a scan) would flag every larger one as
# Heuristics.Limits.Exceeded (AlertExceedsMax) or refuse its stream, so the
# limits sit just above the largest upload any purpose takes.
StreamMaxLength 210M
MaxFileSize 210M
MaxScanSize 420M
MaxScanTime 300000
