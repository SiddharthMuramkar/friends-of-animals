# systemd drop-in for crowdsec-firewall-bouncer.service (installed by
# docker/scripts/install-crowdsec.sh). Ubuntu: the iptables bouncer also
# inserts its rule into DOCKER-USER, which exists only once Docker has started,
# and the bouncer fails without it. Fedora: the nftables bouncer has no such
# dependency; the ordering is kept so both OSes start the same way.
[Unit]
After=docker.service
Wants=docker.service
