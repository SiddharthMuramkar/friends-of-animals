# systemd drop-in for crowdsec.service (installed by
# docker/scripts/install-crowdsec.sh). The docker acquisition of foa-pgbouncer
# asks the Docker API for `docker info` while CrowdSec loads its config, and
# CrowdSec exits if that fails ("failed to get docker info"). Started before
# Docker at boot, it would sit failed until its 60 s restart.
[Unit]
After=docker.service
Wants=docker.service
