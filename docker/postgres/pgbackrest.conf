# pgBackRest for pg-prod (stanza `foa`). pg-nonprod is not backed up.
#
# repo1-cipher-pass is not here: it comes from conf.d/cipher.conf, mounted
# from /etc/foa/secrets/pgbackrest_cipher.conf. Lose that passphrase and every
# backup in every repo is unreadable; keep an offline copy (docker/README.md).

[global]
# repo1: interim local POSIX repository on the dedicated `pgbackrest-repo`
# volume (not the data volume). It protects against operator error and
# corruption, not against losing the VPS: that needs repo2 off-site.
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
repo1-bundle=y
repo1-block=y

# repo2 (later, on FOA's Cloudflare account, #18): an R2 bucket, same cipher
# type, its own passphrase (repo2-cipher-pass) and S3 keys in conf.d/, never here.
# repo2-type=s3
# repo2-s3-endpoint=<account-id>.r2.cloudflarestorage.com
# repo2-s3-bucket=foa-pgbackrest
# repo2-s3-region=auto
# repo2-s3-uri-style=path
# repo2-path=/foa
# repo2-cipher-type=aes-256-cbc
# repo2-retention-full-type=time
# repo2-retention-full=30
# repo2-bundle=y
# repo2-block=y

compress-type=zst
process-max=2
start-fast=y
delta=y

# Asynchronous archiving: archive_command returns once the segment is queued
# in the spool; a background process pushes it. Do not set
# archive-push-queue-max without an alert: when the queue is full pgBackRest
# drops WAL and PITR has a gap.
archive-async=y
spool-path=/var/spool/pgbackrest

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[global:archive-push]
compress-level=3

[foa]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
