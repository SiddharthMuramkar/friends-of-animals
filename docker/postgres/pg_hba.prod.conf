# pg-prod client authentication. First matching line wins.
#
# Addresses come from compose.yml (network `db`, 10.112.12.0/24):
#   10.112.12.1   gateway = the host itself (SSH tunnels: ssh -L ...:10.112.12.10:5432)
#   10.112.12.20  pgbouncer
#   10.112.12.30  umami (analytics.yml)
#
# TYPE  DATABASE  USER                  ADDRESS            METHOD

# `docker exec ... psql -U postgres` and pgBackRest use the container-local socket.
local   all       postgres                                 trust
local   all       all                                      scram-sha-256

# Superuser over TCP only from the host (SSH tunnel). Never through PgBouncer.
host    all       postgres              10.112.12.1/32     scram-sha-256
host    all       postgres              0.0.0.0/0          reject
host    all       postgres              ::/0               reject

# PgBouncer's auth_query role: only from PgBouncer, only the maintenance DB.
host    postgres  pgbouncer_auth        10.112.12.20/32    scram-sha-256
host    all       pgbouncer_auth        0.0.0.0/0          reject
host    all       pgbouncer_auth        ::/0               reject

# Application roles, from the compose network (PgBouncer, later the worker).
host    foa       foa_app,foa_migrator  10.112.12.0/24     scram-sha-256
# The production worker (docker/workers.yml), connecting directly.
host    foa       foa_worker            10.112.12.0/24     scram-sha-256

# Umami (analytics.yml): its own role and database only, from its own address.
host    umami     umami                 10.112.12.30/32    scram-sha-256

host    all       all                   0.0.0.0/0          reject
host    all       all                   ::/0               reject
