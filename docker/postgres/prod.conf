# pg-prod: PostgreSQL 18 configuration (mounted read-only as config_file).
#
# Production only: database `foa`. Container limits (compose.yml): 4 CPUs,
# 10 GB RAM. Settings not listed keep their PostgreSQL 18 defaults (page
# checksums are on from initdb, io_method=worker).

# Connections ------------------------------------------------------------
listen_addresses = '*'            # only reachable on the private Docker network
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100             # PgBouncer: foa 20+5, migrator <=10, auth 2
superuser_reserved_connections = 3
password_encryption = scram-sha-256
# TLS terminates at PgBouncer; the hop on the private network stays plaintext.
ssl = off

# Memory -----------------------------------------------------------------
shared_buffers = 4GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try
dynamic_shared_memory_type = posix   # /dev/shm, sized by shm_size in compose.yml

# Planner and I/O (SSD-backed VPS) -------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# WAL and checkpoints ----------------------------------------------------------
wal_level = replica
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Archiving (pgBackRest, stanza `foa`; see pgbackrest.conf) ---------------------
# archive_timeout forces a segment switch at least every 60 s, so a lost VPS
# loses about 1-2 minutes of commits (RPO <= 5 min). Archive-push is async.
archive_mode = on
archive_command = 'pgbackrest --stanza=foa archive-push %p'
archive_timeout = 60

# Sessions ---------------------------------------------------------------------
# Safety net for admin sessions; PgBouncer applies its own idle limits.
idle_in_transaction_session_timeout = '10min'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'                 # English log text for CrowdSec and grep
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# Logging (stderr -> docker logs) -------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_checkpoints = on
log_lock_waits = on
log_min_duration_statement = 1000   # ms
log_parameter_max_length = 0        # never log bind values (PII)
log_parameter_max_length_on_error = 0
log_temp_files = 65536              # kB
log_autovacuum_min_duration = '10min'
