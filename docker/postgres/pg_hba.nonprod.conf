# pg-nonprod client authentication. First matching line wins.
#
# Addresses come from compose.yml (network `db`, 10.112.12.0/24):
#   10.112.12.1   gateway = the host itself (SSH tunnels: ssh -L ...:10.112.12.11:5432)
#   10.112.12.20  pgbouncer
#
# TYPE  DATABASE  USER                           ADDRESS            METHOD

local   all       postgres                                          trust
local   all       all                                               scram-sha-256

# Superuser over TCP only from the host (SSH tunnel). Never through PgBouncer.
host    all       postgres                       10.112.12.1/32     scram-sha-256
host    all       postgres                       0.0.0.0/0          reject
host    all       postgres                       ::/0               reject

# PgBouncer's auth_query role: only from PgBouncer, only the maintenance DB.
host    postgres  pgbouncer_auth                 10.112.12.20/32    scram-sha-256
host    all       pgbouncer_auth                 0.0.0.0/0          reject
host    all       pgbouncer_auth                 ::/0               reject

# Staging and preview roles. Database names are dynamic (foa_pr_<n>,
# foa_br_<slug>); `postgres` is where previews run CREATE DATABASE. Database
# CONNECT grants narrow this further (see bootstrap/nonprod.sql).
host    all       nonprod_app,nonprod_migrator   10.112.12.0/24     scram-sha-256

host    all       all                            0.0.0.0/0          reject
host    all       all                            ::/0               reject
