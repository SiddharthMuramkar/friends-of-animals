# journald for the FOA VPS (#66): keep container logs (Docker's journald
# driver, `x-logging` in docker/compose.yml and docker/workers.yml) and the
# host's own for a year. Installed as /etc/systemd/journald.conf.d/foa.conf;
# see docker/README.md, "Logs". The off-box copy is HR-24.
[Journal]
Storage=persistent
Compress=yes
# Files whose entries are all older than a year are deleted. Files rotate
# monthly, so an entry stays between 12 and 13 months.
MaxRetentionSec=1year
MaxFileSec=1month
# The default cap (10 % of the disk, at most 4 GiB) holds weeks, not a
# year. If 20 GiB fills first, the oldest files go before their year is
# up: `journalctl --disk-usage` shows how close it is. Files are 128 MiB
# at most, so 20 GiB is 160 of them; the default limit of 100 files would
# bind first.
SystemMaxUse=20G
SystemMaxFiles=200
# Docker's driver writes every container through dockerd, so all of them
# share docker.service's limit, and one burst (a PgBouncer login flood)
# would drop the lines CrowdSec bans from. The default is 10000 per 30 s,
# multiplied by up to 6 depending on free disk.
RateLimitIntervalSec=30s
RateLimitBurst=100000
