# Local stack for the Friends of Animals app (Docker Compose).
#
#   Full stack (Postgres, then migrations, then the app built from the Dockerfile):
#     docker compose up -d --build --wait   -> http://localhost:3000
#
#   Day-to-day development with hot reload: run only the database here and the
#   app on the host:
#     docker compose up -d db
#     cp .env.example .env && pnpm db:migrate && pnpm dev
#
# Data lives in the named volume `pgdata18`. It has a new name so a Postgres 17
# `pgdata` volume left by the React Router template is never mounted into
# Postgres 18. Remove that old volume by hand once you no longer need it.
#
# Ports are published on 127.0.0.1 only. Docker's published ports bypass host
# firewalls such as ufw, so "5432:5432" would expose the database (and its
# local-only password) to the internet on a VPS. Reach it from another machine
# through an SSH tunnel: ssh -L 5432:127.0.0.1:5432 <host>

services:
  db:
    image: postgres:18.7-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: foa
      POSTGRES_PASSWORD: foa
      POSTGRES_DB: foa
    ports:
      # Published so `pnpm dev` on the host can reach it at localhost:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so mount the parent.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foa -d foa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      # Migrations connect through DIRECT_URL only; here that is the database
      # itself.
      DIRECT_URL: postgres://foa:foa@db:5432/foa
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        # Baked into prerendered pages at build time; keep it equal to the
        # runtime value below.
        APP_URL: ${APP_URL:-http://localhost:3000}
        # The image defaults to production; security headers are baked from
        # this at build time, so keep it equal to the runtime value below.
        APP_ENV: local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://foa:foa@db:5432/foa
      APP_URL: ${APP_URL:-http://localhost:3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata18:
